[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gravityclaw"
version = "0.10.0"
description = "Persistent personal-agent orchestration powered by the official Antigravity CLI"
requires-python = ">=3.12"
dependencies = [
    "croniter>=6,<7",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "python-multipart>=0.0.18",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
gravityclaw-agy-probe = "gravityclaw.probe:main"
gravityclaw-server = "gravityclaw.server:main"
gravityclaw-ops = "gravityclaw.ops:main"
gravityclaw = "gravityclaw.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gravityclaw"]

[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "gravityclaw/web_dist"

[tool.pytest.ini_options]
testpaths = ["tests"]
