name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run tests
        run: pytest --tb=short -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: web

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

  package:
    name: Package (wheel + web_dist)
    runs-on: ubuntu-latest
    needs: [test-python, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: web

      - name: Build wheel
        run: |
          pip install build
          python -m build

      - name: Inspect wheel contents
        run: |
          pip install wheel-inspect
          wheel2json dist/*.whl | python -c "
          import json, sys
          data = json.load(sys.stdin)
          files = data.get('record', [])
          web_files = [f for f in files if 'web_dist' in str(f)]
          print(f'Total files in wheel: {len(files)}')
          print(f'web_dist files: {len(web_files)}')
          assert len(web_files) > 0, 'web_dist missing from wheel'
          "

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: pip-audit
        run: |
          pip install pip-audit
          pip install -e .
          pip-audit

      - name: npm audit
        run: npm ci && npm audit --omit=dev
        working-directory: web

  container:
    name: Container image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build server image
        run: docker build -t gravityclaw-server:ci .

      - name: Verify image runs
        run: |
          docker run --rm gravityclaw-server:ci python -c "import gravityclaw; print(gravityclaw.__name__)"
